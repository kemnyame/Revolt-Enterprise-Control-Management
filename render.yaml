services:
  - type: web
    name: Revolt-Enterprise-Control-Management
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: Revolt-Enterprise-Control-Management-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: Revolt-Enterprise-Control-Management-db
    plan: free
